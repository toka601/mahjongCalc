<!DOCTYPE html>

<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>点数計算ツール</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div id="header">
            <header>点数計算ツール</header>

            <button id="imageButton" class="imageButton">
                <img src="info_icon.png" alt="ボタン">
            </button>
        </div>

        <!-- ポップアップ -->
        <div id="popup" class="popupOverlay">

            <div class="popupWindow">

                <!-- タイトル -->
                <div class="popupHeader">
                    <h2>ヘルプ</h2>
                    <button id="closeButton">×</button>
                </div>

                <div data-element="pages">

                    <!--<button data-element="tab">試作段階</button>
                    <div data-element="content">
                        <h3>試作段階</h3>

                        <div data-element="list">
                            <div data-element="button">Abutton</div>
                            <div data-element="item">Aitem1</div>
                            <div data-element="list">
                                <div data-element="button">Bbutton1</div>
                                <div data-element="item">Bitem1</div>
                            </div>
                            <div data-element="list">
                                <div data-element="button">Bbutton2</div>
                                <div data-element="item">Bitem2</div>
                            </div>
                            <div data-element="item">Aitem2</div>
                        </div>
                    </div>-->

                    <button data-element="tab">用語解説</button>
                    <div data-element="content" id="descContent">
                        <h3>用語解説</h3>
                        <!-- descList.jsで記載 -->
                    </div>

                    <button data-element="tab">点数表(ロン)</button>
                    <div data-element="content">
                        <h3>点数表(ロン)</h3>
                        <!-- scoreList.jsで記載 -->
                        <div data-element="pages">

                            <button data-element="tab">親</button>
                            <div id="scoreList_rp" data-element="content" class="scoreList"></div>

                            <button data-element="tab">子</button>
                            <div id="scoreList_rc" data-element="content" class="scoreList"></div>
                        </div>
                    </div>

                    <button data-element="tab">点数表(ツモ)</button>
                    <div data-element="content">
                        <h3>点数表(ツモ)</h3>
                        <h6>※1人あたり</h6>
                        <!-- scoreList.jsで記載 -->

                        <div data-element="pages">
                            <button data-element="tab">親</button>
                            <div id="scoreList_tp" data-element="content" class="scoreList"></div>
                            <button data-element="tab">子→親</button>
                            <div id="scoreList_tcp" data-element="content" class="scoreList"></div>
                            <button data-element="tab">子→子</button>
                            <div id="scoreList_tcc" data-element="content" class="scoreList"></div>

                        </div>
                    </div>

                    <button data-element="tab">役一覧</button>
                    <div data-element="content">
                        <h3>役一覧</h3>
                        <!-- yakuList.jsで記載 -->
                        <div data-element="pages">
                            <button data-element="tab">通常</button>
                            <div data-element="content" id="normalYaku"></div>

                            <button data-element="tab">通常 & ローカル役</button>
                            <div data-element="content" id="totalYaku"></div>

                            <button data-element="tab">ローカル役</button>
                            <div data-element="content" id="localYaku"></div>
                        </div>
                    </div>

                    <button data-element="tab">その他</button>
                    <div data-element="content">
                        <h3>その他</h3>

                        書くこと未定。<br><br>ぴっぴろぴー by作者・冬華
                    </div>

                </div>
            </div>

        </div>




















        <button id="resetButton">リセット</button>

        <div id="inputWrap">
            <section>
                <label>自家
                    <input type="radio" name="jicha" value="child">子</input>
                    <input type="radio" name="jicha" value="parent">親</input>
                </label>
            </section>

            <section>
                <label>飜数
                    <select id="han">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                        <option value="11">11</option>
                        <option value="12">12</option>
                        <option value="13">13以上 / 役満</option>
                    </select>
                </label>
            </section>

            <section>
                <label for="futei"">副底</label>
                <div id="futei">20</div>
            </section>

            <section>
                <label>和了
                    <input type="radio" name="hora" value="---" checked>---</input>
                    <input type="radio" name="hora" value="tsumo">ツモ</input>
                    <input type="radio" name="hora" value="ron">門前ロン</input>
                </label>
            </section>

            <section>
                <label>面子
                    <table id="mentsuTable">
                        <tr>
                            <th></th>
                            <th>中張牌</th>
                            <th>幺九牌</th>
                        </tr>
                        <tr>
                            <td>明刻</td>
                            <td>
                                <select class="mentsu" id="chun_m3">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>
                            </td>
                            <td>
                                <select class="mentsu" id="yao_m3">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>暗刻</td>
                            <td>
                                <select class="mentsu" id="chun_a3">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option><!--四暗刻-->
                                </select>
                            </td>
                            <td>
                                <select class="mentsu" id="yao_a3">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option><!--四暗刻-->
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>明槓</td>
                            <td>
                                <select class="mentsu" id="chun_m4">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option><!--四槓子-->
                                </select>
                            </td>
                            <td>
                                <select class="mentsu" id="yao_m4">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option><!--四槓子-->
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td>暗槓</td>
                            <td>
                                <select class="mentsu" id="chun_a4">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option><!--四槓子+四暗刻単騎-->
                                </select>
                            </td>
                            <td>
                                <select class="mentsu" id="yao_a4">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option><!--四槓子+四暗刻単騎-->
                                </select>
                            </td>
                        </tr>
                    </table>
                </label>
            </section>

            <section>
                <label>雀頭
                    <input type="radio" name="janto" value="---" checked>---</input>
                    <input type="radio" name="janto" value="jifu">自風牌</input>
                    <input type="radio" name="janto" value="bafu">場風牌</input>
                    <input type="radio" name="janto" value="renfu">連風牌(自場風牌)</input>
                    <input type="radio" name="janto" value="sangen">三元牌</input>
                </label>

            </section>

            <section>
                <label>待ち
                    <input type="radio" name="machi" value="---" checked>---</input>
                    <input type="radio" name="machi" value="tanki">単騎待ち</input>
                    <input type="radio" name="machi" value="kanchan">嵌張待ち</input>
                    <input type="radio" name="machi" value="penchan">辺張待ち</input>
                </label>
            </section>

            <section>
                <label>例外
                    <input type="radio" name="exception" value="---" checked>---</input>
                    <input type="radio" name="exception" value="pinfu">平和</input>
                    <input type="radio" name="exception" value="chitoi">七対子</input>
                </label>
            </section>
        </div>

        <button id="resultButton">計算結果</button>

        <div id="resultWrap">
            <div id="resultFu">0符 → 0符</div>
            <div id="resultScore0"></div>
            <div id="resultScore1"></div>
            <div id="resultScoreT">計: 0点</div>
            <div id="resultJudge"></div>
        </div>




        <script src="descList.js"></script>
        <script src="scoreList.js"></script>
        <script src="yakuList.js"></script>

        <script src="calc.js"></script>

        <script src="table.js"></script>
        <script src="infoEvent.js"></script>
        <script src="resetEvent.js"></script>
        <script src="listSetting.js"></script>
        <script src="pageSetting.js"></script>
    </body>
</html>
